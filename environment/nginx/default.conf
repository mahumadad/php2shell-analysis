server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    # Disable request buffering so the multipart body is streamed directly
    # to PHP-FPM — required for CVE-2026-109619 slow-send exploitation.
    # Production nginx defaults to proxy_request_buffering ON, which
    # absorbs the full upload before forwarding and blocks the timing window.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_request_buffering off;
    }
}
