# PHP2Shell — ModSecurity WAF Rules
# CVE-2026-109618 / CVE-2026-109619
#
# Drop-in: Include from modsecurity.conf or CRS setup
# Compatible with ModSecurity 2.x / 3.x (libmodsecurity)
#
# Rule ID range: 9502100 – 9502119

# ============================================================================
# CVE-2026-109619 — Upload Progress UAF
# ============================================================================

# Block PHP_SESSION_UPLOAD_PROGRESS in multipart POST body
SecRule REQUEST_METHOD "POST" \
    "id:9502100, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL CVE-2026-109619 — upload_progress trigger in multipart body', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'CRITICAL', \
    chain"
    SecRule REQUEST_HEADERS:Content-Type "multipart/form-data" "chain"
    SecRule REQUEST_BODY "PHP_SESSION_UPLOAD_PROGRESS" ""

# Block PHP code in upload filename (session file injection)
SecRule REQUEST_METHOD "POST" \
    "id:9502101, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL CVE-2026-109619 — PHP code in upload filename', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'CRITICAL', \
    chain"
    SecRule REQUEST_HEADERS:Content-Type "multipart/form-data" "chain"
    SecRule FILES_NAMES|FILES "<\?(?:php|=)" ""

# Block session ID as POST field (session fixation via upload_progress)
SecRule REQUEST_METHOD "POST" \
    "id:9502102, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL CVE-2026-109619 — session fixation via POST field', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'HIGH', \
    chain"
    SecRule REQUEST_HEADERS:Content-Type "multipart/form-data" "chain"
    SecRule ARGS_NAMES "^PHPSESSID$" ""

# Block excessive array fields (heap spray indicator)
# Trigger: more than 100 fields with the same name in a single request
SecRule &ARGS_GET_NAMES:/(.*)\[\]/ "@gt 100" \
    "id:9502103, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL CVE-2026-109619 — heap spray array fields detected', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'HIGH'"

SecRule &ARGS_POST_NAMES:/(.*)\[\]/ "@gt 100" \
    "id:9502104, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL CVE-2026-109619 — heap spray array fields in POST', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'HIGH'"

# ============================================================================
# CVE-2026-109618 — Serializer Mismatch → POP Chain
# ============================================================================

# Block serialized PHP objects in POST body (pipe-prefixed POP chain)
SecRule REQUEST_METHOD "POST" \
    "id:9502110, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL CVE-2026-109618 — serialized PHP object with pipe prefix', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'CRITICAL', \
    chain"
    SecRule REQUEST_BODY "@rx \|O:\d+:\"[^\"]+\"" ""

# Block known POP gadget class names in POST body
SecRule REQUEST_METHOD "POST" \
    "id:9502111, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL CVE-2026-109618 — known POP gadget class in POST', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'CRITICAL', \
    chain"
    SecRule REQUEST_BODY "@rx (?:Monolog\\\\Handler|Guzzle\\\\(?:Fn|LazyOpen)Stream|Illuminate\\\\(?:PendingCommand|PendingBroadcast)|Symfony\\\\Component\\\\Process|Mockery\\\\Loader|PHPUnit\\\\Framework|SwiftMailer)" ""

# Block shell functions in serialized data
SecRule REQUEST_METHOD "POST" \
    "id:9502112, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL CVE-2026-109618 — shell function in serialized data', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'CRITICAL', \
    chain"
    SecRule REQUEST_BODY "@rx O:\d+:\"[^\"]+\".*?(?:shell_exec|system|passthru|proc_open|popen|pcntl_exec)\b" ""

# ============================================================================
# Generic — Session file LFI
# ============================================================================

# Block LFI targeting session files in URI
SecRule REQUEST_URI|ARGS "@rx /(?:var/lib/php/sessions|tmp)/sess_" \
    "id:9502116, \
    phase:1, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL — LFI targeting PHP session file', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'CRITICAL'"

# Block session file paths in POST body
SecRule REQUEST_METHOD "POST" \
    "id:9502117, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'PHP2SHELL — session file path in POST body', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'HIGH', \
    chain"
    SecRule REQUEST_BODY "@rx /(?:var/lib/php/sessions|tmp)/sess_" ""
