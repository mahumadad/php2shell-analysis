# PHP2Shell — nginx mitigation config
# CVE-2026-109618 / CVE-2026-109619
#
# Include in your server {} or http {} block:
#   include /etc/nginx/conf.d/block_php2shell.conf;
#
# IMPORTANT: These are mitigations, not patches. Upgrade PHP to fix the root cause.

# ── CVE-2026-109619: Disable request buffering bypass ──────────────────────
# When fastcgi_request_buffering is OFF, the multipart body reaches PHP-FPM
# byte by byte, enabling the timing-dependent UAF. Keeping it ON (the default)
# buffers the entire upload before passing it to FPM, which prevents the
# race condition. Only override per-location if you genuinely need streaming.
#
# This should already be the default, but make it explicit:
fastcgi_request_buffering on;

# ── CVE-2026-109619: Limit upload size to reduce attack surface ────────────
# Large uploads take longer to transmit, giving the attacker more time to
# trigger the UAF via the upload_progress handler.
# Adjust to your application's needs (default: 1m).
client_max_body_size 10m;

# ── CVE-2026-109618: Block serialized PHP objects in POST body ─────────────
# The serializer mismatch attack sends |O:<len>:"ClassName" in POST data.
# This map + if block drops requests containing the pipe-prefixed pattern.
# NOTE: Requires ngx_http_lua_module or njs for body inspection.
# If you don't have Lua/njs, use ModSecurity or the WAF rules instead.

# ── Session file LFI — block direct session path references ────────────────
location ~* /var/lib/php/sessions/ {
    deny all;
    return 403;
}

location ~* /tmp/sess_ {
    deny all;
    return 403;
}

# ── Block .user.ini access (prevent attacker from reading/confirming) ──────
location ~ /\.user\.ini$ {
    deny all;
    return 403;
}

# ── Rate limit multipart uploads to PHP endpoints ──────────────────────────
# Slows down brute-force UAF attempts. Adjust zone size and rate as needed.
# Add to http {} block:
#   limit_req_zone $binary_remote_addr zone=php_upload:10m rate=10r/m;
#
# Then in location blocks serving PHP:
#   limit_req zone=php_upload burst=5 nodelay;
